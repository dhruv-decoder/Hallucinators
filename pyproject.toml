[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlplane"
version = "0.1.0"
description = "Real-time AI oversight as a value-of-information decision under a latency budget."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Team Hallucinators" },
]

# Core runtime dependencies for the decision engine (kept light so the core runs
# without downloading any ML models). Pinned to the versions we develop against.
dependencies = [
  "pydantic==2.13.4",
  # Range rather than an exact pin because the optional [ml] extra (spaCy) currently requires numpy<2.5.
  "numpy>=2.4,<2.6",
]

[project.optional-dependencies]
# The gateway / proxy layer (The Tower) + the Control-Tower dashboard. Kept optional so the core engine can
# be installed and tested on its own. This is enough to run the whole demo offline (no model downloads).
serve = [
  "fastapi==0.141.1",
  "uvicorn==0.52.3",
  "httpx>=0.27",  # used by the one-line base_url-swap traffic driver
]
# Real multi-provider upstream (OpenAI/Anthropic/Bedrock/OSS). Only needed to route to a live model instead
# of the offline simulator; the proxy imports litellm lazily so it is never a hard dependency.
providers = [
  "litellm>=1.0",
]
# Optional model-backed detectors. The core engine and demos run without any of these (heuristics + a
# graceful fallback); install this extra to enable the real models. After installing:
#   python -m spacy download en_core_web_sm      # for the Presidio NER PII detector (opt-in)
# HHEM-2.1-Open (groundedness) downloads on first use from the Hugging Face hub.
# Enable Presidio at runtime with CONTROLPLANE_USE_PRESIDIO=1 (it needs the spaCy model above).
ml = [
  "presidio-analyzer>=2.2",
  "spacy>=3.7,<4",
  # HHEM-2.1-Open's custom model code needs transformers 4.x -- with 5.x the checkpoint loads with
  # newly-initialised (random) weights and silently produces garbage. Verified working on 4.44.2.
  "transformers>=4.40,<5",
  "torch>=2.2",
]
# Optional semantic response caching. Kept separate because sentence-transformers/torch are large; enabling it is a deliberate deployment choice.
semantic-cache = [
  "sentence-transformers>=3.0,<6",
]
# Real public-benchmark evaluation (HaluEval / RAGTruth). Optional; keeps the core install light.
eval = [
  "datasets>=2.19",
]
# Developer tooling.
dev = [
  "pytest==8.3.4",
  "ruff==0.8.4",
]

[tool.hatch.build.targets.wheel]
packages = ["controlplane"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Sensible defaults: pyflakes (F), pycodestyle (E,W), isort (I), bugbear (B), pyupgrade (UP).
select = ["E", "W", "F", "I", "B", "UP"]
