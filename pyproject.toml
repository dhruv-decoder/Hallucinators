[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlplane"
version = "0.1.0"
description = "Real-time AI oversight as a value-of-information decision under a latency budget."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Team Hallucinators" },
]

# Core runtime dependencies for the decision engine (kept light so the core runs
# without downloading any ML models). Pinned to the versions we develop against.
dependencies = [
  "pydantic==2.13.4",
  # Range rather than an exact pin because the optional [ml] extra (spaCy) currently requires numpy<2.5.
  "numpy>=2.4,<2.6",
]

[project.optional-dependencies]
# The gateway / proxy layer (owned by P2). Kept optional so the core engine can be
# installed and tested on its own.
serve = [
  "fastapi==0.141.1",
  "uvicorn==0.52.3",
  "litellm>=1.0",
  "httpx>=0.28,<1",
  "PyYAML>=6.0",
]
# Optional model-backed detectors. Presidio + spaCy power the NER-based PII detector (realised today).
# After installing this extra, download the spaCy model once:
#   python -m spacy download en_core_web_sm
# Left with loose bounds; groundedness (HHEM/MiniCheck) and safety models are added as they are wired.
ml = [
  "presidio-analyzer>=2.2",
  "spacy>=3.7,<4",
]
# Developer tooling.
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==1.4.0",
  "ruff==0.8.4",
]

[tool.hatch.build.targets.wheel]
packages = ["controlplane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Sensible defaults: pyflakes (F), pycodestyle (E,W), isort (I), bugbear (B), pyupgrade (UP).
select = ["E", "W", "F", "I", "B", "UP"]
