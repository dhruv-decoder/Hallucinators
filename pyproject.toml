[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlplane"
version = "0.1.0"
description = "Real-time AI oversight as a value-of-information decision under a latency budget."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Team Hallucinators" },
]

# Core runtime dependencies for the decision engine (kept light so the core runs
# without downloading any ML models). Pinned to the versions we develop against.
dependencies = [
  "pydantic==2.13.4",
  "numpy==2.5.2",
]

[project.optional-dependencies]
# The gateway / proxy layer (owned by P2). Kept optional so the core engine can be
# installed and tested on its own.
serve = [
  "fastapi==0.141.1",
  "uvicorn==0.52.3",
  "litellm>=1.0",
]
# Heavy detector models (groundedness, PII, safety). Added as we wire real models
# in place of the T0 heuristics. Left unpinned until we choose exact versions.
ml = [
  "gliner",
  "presidio-analyzer",
  "sentence-transformers",
]
# Developer tooling.
dev = [
  "pytest==8.3.4",
  "ruff==0.8.4",
]

[tool.hatch.build.targets.wheel]
packages = ["controlplane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Sensible defaults: pyflakes (F), pycodestyle (E,W), isort (I), bugbear (B), pyupgrade (UP).
select = ["E", "W", "F", "I", "B", "UP"]
