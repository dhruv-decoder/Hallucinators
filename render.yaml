# One-click, single-service deploy to Render (Docker). The multi-stage Dockerfile builds the Next.js UI and
# serves it together with the API from one Python service. No GPU needed; runs offline (simulated upstream).
# To use a real judge model on the free tier, add GROQ_API_KEY (free) and remove CONTROLPLANE_FORCE_SIM.
services:
  - type: web
    name: controlplane-tower
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /readyz
    envVars:
      - key: CONTROLPLANE_FORCE_SIM
        value: "1"
      - key: CONTROLPLANE_WARMUP
        value: "1"
      # Auto-generate a strong JWT signing secret so auth is secure by default (no dev fallback in prod).
      # The auth + per-workspace stores live on the ephemeral disk here, so accounts reset on redeploy; the
      # demo account (demo@controlplane.ai / demo1234) is re-seeded on boot. Mount a disk to persist them.
      - key: CONTROLPLANE_AUTH_SECRET
        generateValue: true
